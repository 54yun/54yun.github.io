  <script>
    // ===== 快捷键配置 =====
    // 未来新增快捷键:在 SHORTCUTS 中加一行即可,例如 'g': { url: 'https://example.com' }
    // 多字符键位按顺序连续输入触发(如先按 w 再按 x)。
    const SHORTCUTS = {
      'b': { url: '/bookmarks.html' },                    // 书签页
      'wx': { url: 'https://filehelper.weixin.qq.com/' }, // 微信文件传输助手
    };

    // 输入缓冲超时(毫秒):连续输入超过此时长仍未命中,则清空缓冲重新开始
    const BUFFER_RESET_MS = 2000;

    let buffer = '';
    let timer;
    let navigating = false;

    document.addEventListener('keydown', function (e) {
      if (navigating) return; // 已命中快捷键、正在跳转,忽略后续输入

      const key = e.key.toLowerCase();
      if (key.length !== 1) return; // 过滤功能键与 IME 组合输入

      clearTimeout(timer);
      buffer += key;

      if (SHORTCUTS[buffer]) {
        navigating = true;
        const url = SHORTCUTS[buffer].url;
        buffer = '';
        window.location.href = url;
        return;
      }

      const isPrefix = Object.keys(SHORTCUTS).some(k => k.startsWith(buffer) && k !== buffer);
      if (!isPrefix) buffer = '';

      timer = setTimeout(() => { buffer = ''; }, BUFFER_RESET_MS);
    });
  </script>
